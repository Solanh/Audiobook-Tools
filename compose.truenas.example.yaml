name: media-janitor

x-media-janitor-common: &media-janitor-common
  image: media-janitor:local
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m
  healthcheck:
    test: ["CMD", "media-janitor", "--help"]
    interval: 30s
    timeout: 5s
    retries: 3

services:
  media-janitor:
    <<: *media-janitor-common
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap 'exit 0' TERM INT; while :; do sleep 3600; done"]
    volumes:
      # Replace these example host paths with your TrueNAS datasets.
      - /mnt/tank/media:/media:ro
      - /mnt/tank/apps/media-janitor:/state:rw

  media-janitor-review:
    <<: *media-janitor-common
    profiles: ["review"]
    restart: unless-stopped
    command: ["review-server", "--state-dir", "/state", "--bind", "0.0.0.0", "--port", "8090"]
    environment:
      # The review server refuses non-loopback exposure when this is empty or too short.
      MEDIA_JANITOR_REVIEW_TOKEN: ${MEDIA_JANITOR_REVIEW_TOKEN:-}
    ports:
      - "${MEDIA_JANITOR_REVIEW_PORT:-8090}:8090"
    volumes:
      # The review UI intentionally receives no /media mount at all.
      - /mnt/tank/apps/media-janitor:/state:rw

  media-janitor-writer:
    <<: *media-janitor-common
    profiles: ["write"]
    restart: "no"
    # Keep the image's media-janitor entrypoint so `docker compose run`
    # receives apply/rollback arguments directly.
    entrypoint: ["media-janitor"]
    command: ["--help"]
    volumes:
      # The writer is intentionally a separate opt-in service.
      - /mnt/tank/media:/media:rw
      - /mnt/tank/apps/media-janitor:/state:rw
