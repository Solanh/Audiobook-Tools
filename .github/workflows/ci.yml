name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Compile package and tests
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker and Compose
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t media-janitor:ci .

      - name: Smoke test image
        run: docker run --rm media-janitor:ci --help

      - name: Tag image for Compose example
        run: docker tag media-janitor:ci media-janitor:local

      - name: Validate Compose configuration
        run: docker compose -f compose.truenas.example.yaml --profile write config >/dev/null

      - name: Smoke test writer entrypoint
        run: |
          sudo mkdir -p /mnt/tank/media /mnt/tank/apps/media-janitor
          sudo chown -R 10001:10001 /mnt/tank/apps/media-janitor
          docker compose -f compose.truenas.example.yaml --profile write run --rm --no-deps \
            media-janitor-writer --help
