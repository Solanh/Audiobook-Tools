name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Compile package and tests
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker and Compose
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t media-janitor:ci .

      - name: Smoke test image
        run: docker run --rm media-janitor:ci --help

      - name: Tag image for Compose example
        run: docker tag media-janitor:ci media-janitor:local

      - name: Validate Compose configuration
        env:
          MEDIA_JANITOR_REVIEW_TOKEN: ci-review-token-0123456789abcdef
        run: docker compose -f compose.truenas.example.yaml --profile write --profile review config >/dev/null

      - name: Prepare TrueNAS-style host paths
        run: |
          sudo mkdir -p /mnt/tank/media /mnt/tank/apps/media-janitor
          printf 'book' | sudo tee /mnt/tank/media/before.m4b >/dev/null
          sudo tee /mnt/tank/apps/media-janitor/plan.json >/dev/null <<'JSON'
          {
            "schema_version": 1,
            "root": "/media",
            "operations": [
              {
                "operation_id": "ci-rename",
                "kind": "rename",
                "source": "before.m4b",
                "destination": "after.m4b",
                "reason": "CI reversible container smoke test"
              }
            ]
          }
          JSON
          sudo chown -R 10001:10001 /mnt/tank/media /mnt/tank/apps/media-janitor

      - name: Apply plan through writer container
        run: |
          docker compose -f compose.truenas.example.yaml --profile write run --rm --no-deps \
            media-janitor-writer apply-plan /state/plan.json --state-dir /state --confirm-apply
          test ! -e /mnt/tank/media/before.m4b
          test -f /mnt/tank/media/after.m4b
          test "$(cat /mnt/tank/media/after.m4b)" = "book"

      - name: Roll back through writer container
        run: |
          journal="$(find /mnt/tank/apps/media-janitor/journals -type f -name '*.json' -print -quit)"
          test -n "$journal"
          journal_name="$(basename "$journal")"
          docker compose -f compose.truenas.example.yaml --profile write run --rm --no-deps \
            media-janitor-writer rollback "/state/journals/$journal_name" --confirm-rollback
          test -f /mnt/tank/media/before.m4b
          test ! -e /mnt/tank/media/after.m4b
          test "$(cat /mnt/tank/media/before.m4b)" = "book"

      - name: Initialize review state through container
        env:
          MEDIA_JANITOR_REVIEW_TOKEN: ci-review-token-0123456789abcdef
        run: |
          docker compose -f compose.truenas.example.yaml --profile review run --rm --no-deps \
            media-janitor-review state-init --state-dir /state
          test -f /mnt/tank/apps/media-janitor/media-janitor.sqlite3

      - name: Start isolated review service
        env:
          MEDIA_JANITOR_REVIEW_TOKEN: ci-review-token-0123456789abcdef
        run: |
          docker compose -f compose.truenas.example.yaml --profile review up -d media-janitor-review
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/health >/tmp/review-health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"status": "ok"' /tmp/review-health.json

          code="$(curl -sS -o /tmp/review-login.html -w '%{http_code}' http://127.0.0.1:8090/)"
          test "$code" = "401"
          grep -q 'Review queue login' /tmp/review-login.html

          container_id="$(docker compose -f compose.truenas.example.yaml --profile review ps -q media-janitor-review)"
          test -n "$container_id"
          docker inspect -f '{{range .Mounts}}{{println .Destination}}{{end}}' "$container_id" >/tmp/review-mounts.txt
          grep -qx '/state' /tmp/review-mounts.txt
          ! grep -qx '/media' /tmp/review-mounts.txt

      - name: Stop review service
        if: always()
        env:
          MEDIA_JANITOR_REVIEW_TOKEN: ci-review-token-0123456789abcdef
        run: docker compose -f compose.truenas.example.yaml --profile review down --remove-orphans
