[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "media-janitor"
version = "0.2.0"
description = "Read-only-first media library inventory and cleanup planning for Audiobookshelf and Jellyfin"
requires-python = ">=3.11"
dependencies = [
    "tinytag>=2.2.1,<3",
]

[project.scripts]
media-janitor = "media_janitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
